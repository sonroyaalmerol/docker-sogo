{{- if .Values.sogo.emailAlarms -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "sogo.fullname" . }}-email-alarms-cron
  labels:
    app.kubernetes.io/name: {{ include "sogo.name" . }}
    helm.sh/chart: {{ include "sogo.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
{{- $lock := include "sogo.cronLock" (dict "ctx" . "key" "ealarms" "ttl" 50) }}
{{- if or .Values.sogo.emailAlarms.smtp.username .Values.sogo.emailAlarms.smtp.existingSecret }}
  cron: |
    {{ printf "* * * * * sogo  %s/usr/sbin/sogo-ealarms-notify -p /etc/sogo/smtp.creds" $lock }}
{{- else }}
  cron: |
    {{ printf "* * * * * sogo  %s/usr/sbin/sogo-ealarms-notify" $lock }}
{{- end }}
{{- end }}
