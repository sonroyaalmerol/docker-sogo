{{- if .Values.sogo.sessionCleanup -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "sogo.fullname" . }}-session-cron
  labels:
    app.kubernetes.io/name: {{ include "sogo.name" . }}
    helm.sh/chart: {{ include "sogo.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  cron: |
    {{ (printf "* * * * * sogo  %s/usr/sbin/sogo-tool expire-sessions %d" (include "sogo.cronLock" (dict "ctx" . "key" "expire-sessions" "ttl" 50)) (.Values.sogo.sessionCleanup.maxInactivity | int)) }}
    {{ (printf "* * * * * sogo  %s/usr/sbin/sogo-tool-plus -mode cli -action expire-sessions-creation -duration %d" (include "sogo.cronLock" (dict "ctx" . "key" "expire-sessions-creation" "ttl" 50)) (.Values.sogo.sessionCleanup.durationLimit | int)) }}
{{- end }}
